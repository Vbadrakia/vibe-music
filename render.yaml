# Render deployment configuration (Root Level)
services:
  - type: web
    name: vibe-backend
    env: node
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CACHE_TTL_SECONDS
        value: 300
    healthCheckPath: /health
    autoDeploy: true
