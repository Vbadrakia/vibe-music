# Render deployment configuration
services:
  - type: web
    name: vibe-backend
    env: node
    rootDir: backend
    region: singapore             # closest to India — change to oregon/frankfurt if needed
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GOOGLE_SA_KEY
        sync: false               # Set manually in Render dashboard
      - key: SHEETS_ID
        sync: false
      - key: DRIVE_FOLDER_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CACHE_TTL_SECONDS
        value: 300
    healthCheckPath: /health
    autoDeploy: true
